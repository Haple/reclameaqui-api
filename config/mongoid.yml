development:
  clients:
    default:
      uri: <%= ENV.fetch("MONGODB_URI", "mongodb://127.0.0.1:27017/reclameaqui_api_development") %>

test:
  clients:
    default:
      uri: <%= ENV.fetch("MONGODB_URI", "mongodb://127.0.0.1:27017/reclameaqui_api_test") %>
      options:
        read:
          mode: :primary
        max_pool_size: 1

production:
  clients:
    default:
      uri: <%= ENV.fetch("MONGODB_URI", "mongodb://127.0.0.1:27017/reclameaqui_api_production") %>
